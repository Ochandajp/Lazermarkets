<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fix Admin - LazerMarkets</title>
    <style>
        body {
            background: #0a0c10;
            color: #2ecc71;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: #0f131a;
            border: 1px solid #2ecc71;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
        }
        button {
            background: #2ecc71;
            color: #0a0c10;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
        }
        pre {
            text-align: left;
            background: #1e252f;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔧 Fix Admin Account</h1>
        <button onclick="createAdmin()">Create Admin Account</button>
        <button onclick="listUsers()">List All Users</button>
        <div id="result"></div>
    </div>

    <script>
        const API_URL = window.location.origin;
        
        async function createAdmin() {
            const result = document.getElementById('result');
            result.innerHTML = '⏳ Creating admin...';
            
            try {
                const res = await fetch(`${API_URL}/api/create-admin`);
                const data = await res.json();
                
                if (data.success) {
                    result.innerHTML = `
                        <div style="color:#2ecc71">
                            <p>✅ Admin created successfully!</p>
                            <pre>
Email: admin@lazermarkets.com
Password: Admin123!
                            </pre>
                        </div>
                    `;
                } else {
                    result.innerHTML = `<div style="color:#ff6b6b">❌ Error: ${data.error}</div>`;
                }
            } catch(e) {
                result.innerHTML = `<div style="color:#ff6b6b">❌ Error: ${e.message}</div>`;
            }
        }
        
        async function listUsers() {
            const result = document.getElementById('result');
            result.innerHTML = '⏳ Loading users...';
            
            try {
                const res = await fetch(`${API_URL}/api/users`);
                const users = await res.json();
                
                if (users.length === 0) {
                    result.innerHTML = '<div>📭 No users found in database</div>';
                } else {
                    result.innerHTML = `
                        <div>
                            <p>📊 Users in database (${users.length}):</p>
                            <pre>${users.map(u => `${u.email} - Admin: ${u.isAdmin}`).join('\n')}</pre>
                        </div>
                    `;
                }
            } catch(e) {
                result.innerHTML = `<div style="color:#ff6b6b">❌ Error: ${e.message}</div>`;
            }
        }
    </script>
</body>
</html>
