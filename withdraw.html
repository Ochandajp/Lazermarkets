<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Withdraw Funds | LazerMarkets</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0a0a0a; color: #e0e0e0; min-height: 100vh; }
        .bg-grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0,255,0,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,0,0.02) 1px, transparent 1px); background-size: 50px 50px; z-index: 0; }
        .container { position: relative; z-index: 1; max-width: 500px; margin: 0 auto; padding: 80px 20px 40px; }
        .withdraw-card { background: #0f0f0f; border-radius: 24px; border: 1px solid rgba(0,204,0,0.3); padding: 30px; }
        .withdraw-card h1 { font-size: 28px; margin-bottom: 10px; text-align: center; background: linear-gradient(135deg, #fff, #00cc00); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; }
        .balance-display { background: linear-gradient(135deg, #1a1a1a, #0f0f0f); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 25px; border: 1px solid rgba(0,204,0,0.2); }
        .balance-label { font-size: 14px; color: #888; }
        .balance-amount { font-size: 36px; font-weight: 800; color: #00cc00; }
        .input-group { margin: 20px 0; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .input-group input, .input-group select { width: 100%; padding: 14px; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; color: white; font-size: 16px; }
        .preset-amounts { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
        .preset-btn { background: #1a1a1a; border: 1px solid #333; padding: 8px 16px; border-radius: 30px; color: white; cursor: pointer; transition: 0.2s; }
        .preset-btn:hover { border-color: #00cc00; color: #00cc00; }
        .withdraw-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #ff4444, #cc0000); border: none; border-radius: 12px; color: white; font-weight: 700; font-size: 18px; cursor: pointer; margin-top: 20px; }
        .withdraw-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .info-box { background: rgba(0,204,0,0.1); border-radius: 12px; padding: 15px; margin-top: 20px; font-size: 12px; color: #888; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #00cc00; text-decoration: none; }
        .fee-info { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: #888; }
    </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="container">
    <div class="withdraw-card">
        <h1><i class="fas fa-minus-circle"></i> Withdraw Funds</h1>
        <p class="subtitle">Withdraw your earnings in USDT (2% fee)</p>
        <div class="balance-display"><div class="balance-label">Available Balance</div><div class="balance-amount">$<span id="availableBalance">0</span></div></div>
        <div class="input-group"><label><i class="fas fa-dollar-sign"></i> Amount (USD)</label><input type="number" id="withdrawAmount" placeholder="Enter amount" min="50" step="10"><div class="preset-amounts"><button class="preset-btn" data-amount="50">$50</button><button class="preset-btn" data-amount="100">$100</button><button class="preset-btn" data-amount="500">$500</button><button class="preset-btn" data-amount="1000">$1,000</button></div><div class="fee-info"><span>Withdrawal Fee (2%):</span><span id="feeAmount">$0</span></div><div class="fee-info"><span>You will receive:</span><span id="receiveAmount">$0</span></div></div>
        <div class="input-group"><label><i class="fas fa-network-wired"></i> Network</label><select id="network"><option value="TRC20">TRC20 (USDT - TRON) - Recommended</option><option value="ERC20">ERC20 (USDT - Ethereum)</option><option value="BEP20">BEP20 (USDT - BSC)</option></select></div>
        <div class="input-group"><label><i class="fas fa-qrcode"></i> Wallet Address</label><input type="text" id="walletAddress" placeholder="Enter your USDT wallet address"></div>
        <div class="input-group"><label><i class="fas fa-envelope"></i> Email (for confirmation)</label><input type="email" id="confirmEmail" placeholder="Your registered email"></div>
        <button class="withdraw-btn" id="withdrawBtn"><i class="fas fa-paper-plane"></i> Request Withdrawal</button>
        <div class="info-box"><i class="fas fa-clock"></i> Withdrawals processed within 24-48 hours after admin approval.<br><i class="fas fa-percent"></i> A 2% fee applies to all withdrawals.</div>
        <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>
</div>
<script>
    const API_URL = 'https://lazermarkets.onrender.com';
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (!token) window.location.href = 'index.html';
    let currentBalance = 0;
    async function loadBalance() { try { const res = await fetch(`${API_URL}/api/user/profile`, { headers: { 'Authorization': `Bearer ${token}` } }); const data = await res.json(); currentBalance = data.user.balance; document.getElementById('availableBalance').innerHTML = currentBalance.toFixed(2); } catch(e) { console.error(e); } }
    document.getElementById('withdrawAmount').addEventListener('input', function() { const amount = parseFloat(this.value) || 0; const fee = amount * 0.02; document.getElementById('feeAmount').innerHTML = `$${fee.toFixed(2)}`; document.getElementById('receiveAmount').innerHTML = `$${(amount - fee).toFixed(2)}`; });
    document.querySelectorAll('.preset-btn').forEach(btn => { btn.onclick = () => { const amount = parseFloat(btn.dataset.amount); document.getElementById('withdrawAmount').value = amount; const fee = amount * 0.02; document.getElementById('feeAmount').innerHTML = `$${fee.toFixed(2)}`; document.getElementById('receiveAmount').innerHTML = `$${(amount - fee).toFixed(2)}`; }; });
    document.getElementById('withdrawBtn').onclick = async () => { const amount = parseFloat(document.getElementById('withdrawAmount').value); const network = document.getElementById('network').value; const address = document.getElementById('walletAddress').value; const confirmEmail = document.getElementById('confirmEmail').value; if (!amount || amount < 50) { alert('Minimum withdrawal is $50'); return; } if (amount > currentBalance) { alert('Insufficient balance'); return; } if (!address) { alert('Enter wallet address'); return; } if (!confirmEmail) { alert('Enter email'); return; } if (confirmEmail !== user.email) { alert('Email does not match'); return; } const fee = amount * 0.02; if (!confirm(`Withdrawal Summary:\nAmount: $${amount}\nFee: $${fee.toFixed(2)}\nYou Receive: $${(amount-fee).toFixed(2)}\nNetwork: ${network}\n\nConfirm?`)) return; const btn = document.getElementById('withdrawBtn'); btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Processing...'; try { const res = await fetch(`${API_URL}/api/withdrawal/request`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ amount, network, address }) }); const data = await res.json(); if (data.success) { alert(`Withdrawal request submitted!\nAmount: $${amount}\nNet: $${(amount-fee).toFixed(2)}`); window.location.href = 'dashboard.html'; } else { alert(data.error); loadBalance(); } } catch(e) { alert('Error processing withdrawal'); } finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Request Withdrawal'; } };
    loadBalance();
</script>
</body>
</html>
